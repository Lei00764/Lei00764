name: Waka Readme

on:
  schedule:
    # Runs at 8:30pm UTC (4:30am CST)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - id: waka
        uses: anmol098/waka-readme-stats@master
        env:
          DEBUG_RUN: "True"
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 时间线
          SHOW_LOC_CHART: False
          SHOW_PROFILE_VIEWS: False
          SHOW_COMMIT: False
          SHOW_DAYS_OF_WEEK: False
          SHOW_PROJECTS: False
          SHOW_SHORT_INFO: False
          SHOW_UPDATED_DATE: False
          SHOW_LANGUAGE_PER_REPO: False
          SHOW_AI_CODING: False
      - name: Write README
        env:
          README_CONTENT: ${{ steps.waka.outputs.README_CONTENT }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          readme = Path("README.md")
          text = readme.read_text()
          raw = os.environ["README_CONTENT"]
          if not raw.strip():
              raise RuntimeError("waka-readme-stats produced empty README_CONTENT")
          prefix = "README stats current output:\n\n"
          stats = raw.split(prefix, 1)[1] if prefix in raw else raw
          stats = stats.rstrip()
          stats = stats.replace(")\n\n![AI Code Time]", ") ![AI Code Time]")
          bjt = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%d/%m/%Y %H:%M:%S")

          start = "<!--START_SECTION:waka-->"
          end = "<!--END_SECTION:waka-->"
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          section = f"{start}\n{stats}\n\n Last Updated: {bjt} (UTC+8)\n{end}"
          readme.write_text(before + section + after)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/wakatime.yml
          git commit -m "Update waka stats"
          git push origin HEAD:main
